<html>
    <head>
        <title>My animal fact file</title>
        <style>
            body{background-color: rgb(249, 136, 134);font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
            .fact-file{background-color:rgb(255, 242, 0);color:rgb(3, 255, 238);
            width:260px;padding:25px;margin:30px;border:4px solid fuchsia;}
            .animal-name{color: rgb(250, 250, 248);font-size: 20px;
            }
            .details{color: #095df9;}
            .cool-fact{color:rgb(212, 7, 219);font-style: italic;}

        </style>
    </head>
    <body>
        <center>
        <div class="fact-file">
            <h2 class="animal-name">
                Snow leopard
            </h2>
            <p class="details">
                type:Big cat
            </p>
            <p class="details">Lives in :Mountain ranges of centreal asis</p>
            <p class="details">food:deer,sheep,goats etc</p>
            <p class="cool-fact">
                coolfact: can leap upto 15M in one jump
            </p>
        </div>
        </center>
    </body>
</html>
